[package]
name = "error-examiner"
version = "0.1.0"
edition = "2021"
description = "Local AI error and incident examiner"
license = "MIT"
build = "build.rs"

[dependencies]
arboard = "3.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.27"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1.11"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
rmcp = { version = "3.1", features = ["transport-io"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.24.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "error-examiner"
path = "src/main.rs"

[[bin]]
name = "error-examiner-mcp"
path = "src/bin/error-examiner-mcp.rs"

[build-dependencies]
winresource = "0.1.31"

[package.metadata.winresource]
ProductName = "Error Examiner"
FileDescription = "Local AI error and incident examiner"
OriginalFilename = "Error-Examiner.exe"
LegalCopyright = "Copyright 2026 Andy and contributors"
