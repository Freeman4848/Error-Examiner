name: Build packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev
      - name: Test
        run: cargo test -j 2
      - name: Package
        run: bash package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Error-Examiner-Linux-x86_64
          path: |
            dist/Error-Examiner-Linux-x86_64.tar.gz
            dist/Error-Examiner-Linux-x86_64.tar.gz.sha256
