name: Build packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --bin error-examiner -j 2
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item target/release/error-examiner.exe package/Error-Examiner.exe
          Copy-Item "Create Desktop Shortcut.cmd",LICENSE package/
          Copy-Item release/README.md package/README.md
          $hash = (Get-FileHash package/Error-Examiner.exe -Algorithm SHA256).Hash
          "$hash  Error-Examiner.exe" | Set-Content package/SHA256SUMS.txt
          Compress-Archive package/* Error-Examiner-Windows-x86_64.zip
          $zipHash = (Get-FileHash Error-Examiner-Windows-x86_64.zip -Algorithm SHA256).Hash
          "$zipHash  Error-Examiner-Windows-x86_64.zip" | Set-Content Error-Examiner-Windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Error-Examiner-Windows-x86_64
          path: |
            Error-Examiner-Windows-x86_64.zip
            Error-Examiner-Windows-x86_64.zip.sha256

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev
      - name: Test
        run: cargo test -j 2
      - name: Package
        run: bash package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Error-Examiner-Linux-x86_64
          path: |
            dist/Error-Examiner-Linux-x86_64.tar.gz
            dist/Error-Examiner-Linux-x86_64.tar.gz.sha256
